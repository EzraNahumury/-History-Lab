<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History Lab</title>
  <!-- External stylesheet only (CSP: no inline styles). -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🏛️</span>
        <span class="brand-text">
          <strong>History&nbsp;Lab</strong>
          <em>fact-check the AI to win</em>
        </span>
      </div>
      <div class="topbar-right">
        <div class="hud" id="hud">Turn 1 · Accuracy 100%</div>
        <label class="switch" title="Run the full loop offline with grounded scripted content — no account, zero quota.">
          <input type="checkbox" id="mockToggle" checked />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Mock</span>
        </label>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"><!-- rendered by app.js --></main>

    <footer class="footer">
      <span id="status" class="status">loading…</span>
      <span class="tagline">AI generates · the human ratifies · Anna remembers</span>
    </footer>
  </div>

  <!-- anna-tool-ids.js maps bundled executa handles -> server-minted tool_ids.
       Classic script, loaded BEFORE the module so ledger.js can read the map.
       Same-origin, so the script-src 'self' CSP allows it. Regenerated by
       `anna-app dev` / `apps push`. -->
  <script src="./anna-tool-ids.js"></script>
  <!-- Module entry only (CSP: script-src 'self', no inline scripts). -->
  <script type="module" src="./app.js"></script>
</body>
</html>
